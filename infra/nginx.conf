server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  location /api/ { proxy_pass http://server:2567; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /health/ { proxy_pass http://server:2567; }
  location /realtime/ {
    proxy_pass http://server:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;
  }
  location /assets/ { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
